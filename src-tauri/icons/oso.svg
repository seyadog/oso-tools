      <path d="M30 392 C14 300 56 196 150 168 C236 142 322 176 356 252 C372 296 372 350 366 396 C300 412 100 414 30 392 Z"/>
      <!-- hind foot -->
      <ellipse cx="74" cy="392" rx="50" ry="30"/>
      <!-- head -->
      <circle cx="340" cy="212" r="38"/>
      <circle cx="446" cy="218" r="34"/>
      <circle cx="394" cy="326" r="100"/>
      <!-- front paw -->
      <ellipse cx="296" cy="392" rx="52" ry="26"/>
    </g>
  </defs>
  <g transform="translate(5 -36) scale(.94) translate(6 18)">
    <ellipse cx="260" cy="424" rx="230" ry="16" fill="#000" opacity=".18"/>
    <use href="#fur" fill="#3f2616" stroke="#3f2616" stroke-width="18" stroke-linejoin="round"/>
    <use href="#fur" fill="#8a5a3a"/>
    <!-- belly -->
    <path d="M96 340 C100 280 170 250 232 258 C296 266 330 304 316 348 C304 384 150 394 108 372 C98 366 95 354 96 340 Z" fill="#d2a679"/>
    <!-- hind sole and front paw pads -->
    <ellipse cx="60" cy="392" rx="22" ry="16" fill="#d2a679"/>
    <ellipse cx="300" cy="396" rx="26" ry="13" fill="#d2a679"/>
    <path d="M276 388 v8 M298 386 v10 M320 388 v8" stroke="#8a5a3a" stroke-width="4" stroke-linecap="round"/>
    <!-- ears -->
    <circle cx="340" cy="214" r="19" fill="#d2a679"/>
    <circle cx="446" cy="220" r="17" fill="#d2a679"/>
    <!-- muzzle, nose, open mouth -->
    <ellipse cx="418" cy="360" rx="56" ry="44" fill="#d2a679"/>
    <ellipse cx="428" cy="392" rx="23" ry="15" fill="#3a1a1a"/>
    <ellipse cx="426" cy="399" rx="13" ry="7" fill="#d9707a"/>
    <ellipse cx="440" cy="336" rx="19" ry="13" fill="#241410"/>
    <!-- closed eyes, a little cheek -->
    <path d="M338 306 q16 14 34 0" stroke="#241410" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M410 300 q16 14 34 0" stroke="#241410" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="338" cy="346" rx="16" ry="9" fill="#d98f7a" opacity=".5"/>
