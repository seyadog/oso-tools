[package]
name = "oso"
version = "0.2.0"
edition = "2024"
description = "oso: a graphical SSH workspace with tiling terminals and screens"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
oso-core = { path = "../core" }
anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
